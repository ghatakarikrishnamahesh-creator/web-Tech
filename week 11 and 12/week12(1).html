
<html>
<head>
    <title>JavaScript Object</title>
</head>
<body>

<h2>Student Details</h2>

<p id="result"></p>

<script>

let student = {
    name: "Rahul",
    age: 20,
    course: "BCA",
    city: "Bangalore"
};

document.getElementById("result").innerHTML =
    "Name: " + student.name + "<br>" +
    "Age: " + student.age + "<br>" +
    "Course: " + student.course + "<br>" +
    "City: " + student.city;

</script>

</body>
</html>
