
<html>
<head>
    <title>Object Properties and Methods</title>
</head>
<body>

<h2>Student Details</h2>

<p id="result"></p>

<script>

let student = {
    name: "Rahul",
    age: 20,
    course: "BCA",

    display: function() {
        return "Name: " + this.name + "<br>" +
               "Age: " + this.age + "<br>" +
               "Course: " + this.course;
    }
};

document.getElementById("result").innerHTML =
student.display();

</script>

</body>
</html>
