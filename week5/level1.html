<!DOCTYPE html>
<html>
<head>
    <title>Font Properties</title>

    <style>
        h1 {
            font-size: 32px;
            font-style: italic;
            font-family: Georgia, serif;
        }

        p {
            font-size: 20px;
            font-style: normal;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Web Page</h1>

    <p>
        This is a paragraph demonstrating font size, font style,
        and font family using CSS.
    </p>

</body>
</html>
