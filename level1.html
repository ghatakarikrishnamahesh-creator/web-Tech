<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static and Relative Positioning</title>
    <link rel="stylesheet" href="level1.css">
</head>
<body>

    <h1>CSS Positioning Example</h1>

    <div class="container">
        <div class="box static-box">
            Static Position
        </div>

        <div class="box relative-box">
            Relative Position
        </div>

        <div class="box static-box">
            Another Static Box
        </div>
    </div>

</body>
</html>
